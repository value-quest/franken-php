name: Build FrankenPHP with PHP 8.4 and 8.5

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  check-new-release:
    runs-on: ubuntu-latest
    outputs:
      latest_version: ${{ steps.get-latest.outputs.latest_version }}
      has_new_version: ${{ steps.check-new.outputs.has_new_version }}
      php84_latest: ${{ steps.get-php-versions.outputs.php84_latest }}
      php85_latest: ${{ steps.get-php-versions.outputs.php85_latest }}

    steps:
      - name: Get current FrankenPHP version
        id: get-current
        run: |
          echo "current_version=1.4.0" >> $GITHUB_OUTPUT

      - name: Get latest FrankenPHP release
        id: get-latest
        run: |
          LATEST_VERSION=$(curl -s https://api.github.com/repos/php/frankenphp/releases/latest | jq -r '.tag_name' | sed 's/v//')
          echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT

      - name: Check if new version exists
        id: check-new
        run: |
          CURRENT_VERSION="${{ steps.get-current.outputs.current_version }}"
          LATEST_VERSION="${{ steps.get-latest.outputs.latest_version }}"

          if [ "$CURRENT_VERSION" != "$LATEST_VERSION" ]; then
            echo "has_new_version=true" >> $GITHUB_OUTPUT
          else
            echo "has_new_version=false" >> $GITHUB_OUTPUT
          fi

      - name: Get latest PHP 8.4 and 8.5 versions
        id: get-php-versions
        run: |
          PHP84_LATEST=$(curl -s "https://api.github.com/repos/php/php-src/tags?per_page=100" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" | \
            jq -r '[.[] | select(.name | test("^php-8\\.4\\.[0-9]+$"))] | first | .name | ltrimstr("php-")')

          PHP85_LATEST=$(curl -s "https://api.github.com/repos/php/php-src/tags?per_page=100" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" | \
            jq -r '[.[] | select(.name | test("^php-8\\.5\\.[0-9]+$"))] | first | .name | ltrimstr("php-")')

          echo "php84_latest=$PHP84_LATEST" >> $GITHUB_OUTPUT
          echo "php85_latest=$PHP85_LATEST" >> $GITHUB_OUTPUT

  build-php:
    needs: check-new-release
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'schedule' && needs.check-new-release.outputs.has_new_version == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        php:
          - { version: '${{ needs.check-new-release.outputs.php84_latest }}', short: 'php84', minor: '8.4' }
          - { version: '${{ needs.check-new-release.outputs.php85_latest }}', short: 'php85', minor: '8.5' }

    env:
      FRANKENPHP_VERSION: ${{ needs.check-new-release.outputs.latest_version }}
      PHP_VERSION: ${{ matrix.php.version }}
      PHP_SHORT: ${{ matrix.php.short }}
      PHP_MINOR: ${{ matrix.php.minor }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl ca-certificates jq \
            pkg-config libssl-dev zlib1g-dev libbrotli-dev \
            autoconf automake libtool re2c libsqlite3-dev libcurl4-openssl-dev libonig-dev \
            libmariadb-dev libmariadb-dev-compat \
            libzip-dev libpng-dev libjpeg-dev libfreetype6-dev \
            libicu-dev libxslt1-dev sqlite3 zip unzip git python3-dev

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
          cache: false

      - name: Install Node.js 24
        run: |
          sudo apt-get remove -y nodejs npm || true
          sudo rm -rf /usr/local/lib/node_modules /usr/local/bin/node /usr/local/bin/npm /usr/local/bin/npx || true
          curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version
          npm --version

      - name: Download PHP source
        run: |
          mkdir -p php-${PHP_VERSION}
          curl -L "https://github.com/php/php-src/archive/refs/tags/php-${PHP_VERSION}.tar.gz" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" | \
            tar xz --strip-components=1 -C php-${PHP_VERSION}

      - name: Build PHP
        run: |
          cd php-${PHP_VERSION}
          ./buildconf --force
          ./configure \
            --enable-embed \
            --enable-zts \
            --disable-zend-signals \
            --enable-zend-max-execution-timers \
            --enable-cli \
            --enable-mbstring \
            --with-openssl \
            --enable-xml \
            --enable-ctype \
            --with-curl \
            --enable-dom \
            --enable-fileinfo \
            --enable-filter \
            --enable-pdo \
            --with-pdo-sqlite \
            --with-pdo-mysql \
            --with-mysqli \
            --enable-session \
            --enable-tokenizer \
            --enable-bcmath \
            --with-zip \
            --enable-gd \
            --with-freetype \
            --with-jpeg \
            --enable-intl \
            --with-sqlite3 \
            --with-zlib \
            --enable-pcntl \
            --enable-soap \
            --enable-exif \
            --enable-opcache \
            --enable-sockets

          make -j$(nproc)
          sudo make install
          sudo ldconfig
          php -v

      - name: Download FrankenPHP
        run: |
          curl -L https://github.com/php/frankenphp/archive/refs/tags/v${FRANKENPHP_VERSION}.tar.gz | tar xz

      - name: Build FrankenPHP
        working-directory: frankenphp-${{ env.FRANKENPHP_VERSION }}/caddy/frankenphp
        run: |
          CGO_CFLAGS="$(php-config --includes)" \
          CGO_LDFLAGS="$(php-config --ldflags) $(php-config --libs) -Wl,-rpath,\$ORIGIN/../lib" \
          go build -tags=nobadger,nomysql,nopgx,nowatcher

      - name: Download Composer
        run: |
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          EXPECTED_CHECKSUM="$(php -r 'copy("https://composer.github.io/installer.sig", "php://stdout");')"
          ACTUAL_CHECKSUM="$(php -r "echo hash_file('sha384', 'composer-setup.php');")"

          if [ "$EXPECTED_CHECKSUM" != "$ACTUAL_CHECKSUM" ]; then
            echo "Invalid composer installer checksum"
            exit 1
          fi

          php composer-setup.php --quiet
          rm composer-setup.php

      - name: Package files
        run: |
          mkdir -p dist/bin dist/lib dist/libexec

          cp frankenphp-${FRANKENPHP_VERSION}/caddy/frankenphp/frankenphp dist/bin/frankenphp
          cp "$(php-config --prefix)/bin/php" dist/bin/php
          cp "$(php-config --prefix)/bin/php-config" dist/bin/php-config
          cp "$(php-config --prefix)/bin/phpize" dist/bin/phpize
          cp "$(php-config --prefix)/lib/libphp.so" dist/lib/
          cp composer.phar dist/bin/composer
          chmod +x dist/bin/*

          for tool in sqlite3 zip unzip; do
            command -v "$tool" >/dev/null && cp "$(which "$tool")" dist/bin/
          done

          if command -v git >/dev/null; then
            cp "$(which git)" dist/bin/git.real
            GIT_EXEC_PATH=$(git --exec-path)
            mkdir -p dist/libexec/git-core
            cp -r "$GIT_EXEC_PATH"/* dist/libexec/git-core/

            cat > dist/bin/git << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          export GIT_EXEC_PATH="$SCRIPT_DIR/../libexec/git-core"
          exec "$SCRIPT_DIR/git.real" "$@"
          EOF
            chmod +x dist/bin/git
          fi

          if command -v node >/dev/null; then
            cp "$(which node)" dist/bin/
            NODE_PREFIX=$(dirname "$(dirname "$(which node)")")
            mkdir -p dist/lib/node_modules
            cp -r "$NODE_PREFIX/lib/node_modules/npm" dist/lib/node_modules/

            cat > dist/bin/npm << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          export NODE_PATH="$SCRIPT_DIR/../lib/node_modules"
          exec "$SCRIPT_DIR/node" "$SCRIPT_DIR/../lib/node_modules/npm/bin/npm-cli.js" "$@"
          EOF

            cat > dist/bin/npx << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          export NODE_PATH="$SCRIPT_DIR/../lib/node_modules"
          exec "$SCRIPT_DIR/node" "$SCRIPT_DIR/../lib/node_modules/npm/bin/npx-cli.js" "$@"
          EOF

            chmod +x dist/bin/npm dist/bin/npx
          fi

          for binary in dist/bin/frankenphp dist/bin/php dist/lib/libphp.so; do
            ldd "$binary" | grep "=> /" | awk '{print $3}' | grep -v "libc.so" | grep -v "ld-linux" | xargs -I '{}' cp -v '{}' dist/lib/ || true
          done

      - name: Create wrappers
        run: |
          mv dist/bin/php dist/bin/php.real
          cat > dist/bin/php << 'EOF'
          #!/bin/bash
          SOURCE="${BASH_SOURCE[0]}"
          while [ -h "$SOURCE" ]; do
            DIR="$(cd -P "$(dirname "$SOURCE")" && pwd)"
            SOURCE="$(readlink "$SOURCE")"
            [[ $SOURCE != /* ]] && SOURCE="$DIR/$SOURCE"
          done
          SCRIPT_DIR="$(cd -P "$(dirname "$SOURCE")" && pwd)"
          export LD_LIBRARY_PATH="$SCRIPT_DIR/../lib:$LD_LIBRARY_PATH"
          exec "$SCRIPT_DIR/php.real" "$@"
          EOF
          chmod +x dist/bin/php

          mv dist/bin/frankenphp dist/bin/frankenphp.real
          cat > dist/bin/frankenphp << 'EOF'
          #!/bin/bash
          SOURCE="${BASH_SOURCE[0]}"
          while [ -h "$SOURCE" ]; do
            DIR="$(cd -P "$(dirname "$SOURCE")" && pwd)"
            SOURCE="$(readlink "$SOURCE")"
            [[ $SOURCE != /* ]] && SOURCE="$DIR/$SOURCE"
          done
          SCRIPT_DIR="$(cd -P "$(dirname "$SOURCE")" && pwd)"
          export LD_LIBRARY_PATH="$SCRIPT_DIR/../lib:$LD_LIBRARY_PATH"
          exec "$SCRIPT_DIR/frankenphp.real" "$@"
          EOF
          chmod +x dist/bin/frankenphp

      - name: Create install.sh
        run: |
          cat > dist/install.sh << 'EOF'
          #!/bin/bash
          set -e

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" &>/dev/null && pwd)"
          exec 1>&2

          VERSIONED_INSTALL=false
          PHP_VERSION=""

          if [ "${1:-}" = "--versioned" ]; then
              VERSIONED_INSTALL=true
              PHP_VERSION="${2:-}"

              if [[ ! "$PHP_VERSION" =~ ^8\.[0-9]+$ ]]; then
                  echo "Usage: ./install.sh --versioned 8.4|8.5"
                  exit 1
              fi
          fi

          show_versions() {
              echo "=== NEW VERSIONS ==="
              echo "  FrankenPHP: $(cd "$SCRIPT_DIR" && LD_LIBRARY_PATH="$SCRIPT_DIR/lib" ./bin/frankenphp.real version 2>/dev/null | head -1 || echo 'included')"
              echo "  PHP: $(cd "$SCRIPT_DIR" && LD_LIBRARY_PATH="$SCRIPT_DIR/lib" ./bin/php.real --version 2>/dev/null | head -1 || echo 'included')"
              echo "  Node.js: $(cd "$SCRIPT_DIR" && ./bin/node --version 2>/dev/null || echo 'included')"
              echo "  Composer: $(cd "$SCRIPT_DIR" && LD_LIBRARY_PATH="$SCRIPT_DIR/lib" ./bin/composer --version 2>/dev/null | head -1 || echo 'included')"
              echo ""
          }

          install_versioned() {
              local target="$HOME/frankenphp/php$PHP_VERSION"
              local tmp="$target.new"
              local backup="$target.backup.$(date +%Y%m%d-%H%M%S)"

              echo "Installing versioned FrankenPHP PHP $PHP_VERSION"
              echo "Target: $target"
              echo ""

              rm -rf "$tmp"
              mkdir -p "$tmp"

              cp -r "$SCRIPT_DIR/bin" "$tmp/"
              cp -r "$SCRIPT_DIR/lib" "$tmp/"
              [ -d "$SCRIPT_DIR/libexec" ] && cp -r "$SCRIPT_DIR/libexec" "$tmp/"

              chmod +x "$tmp/bin/"*

              if [ -d "$target" ]; then
                  mv "$target" "$backup"
                  echo "Previous version backed up to: $backup"
              fi

              mv "$tmp" "$target"

              echo ""
              echo "Versioned install completed."
              echo "Test"
              echo "-------------------------------"
              echo "export PATH=\"$target/bin:\$PATH\""
              echo "which php"
              echo "php -v"
              echo ""
              echo "which composer"
              echo "composer --version"
              echo ""
              echo "which node"
              echo "  node -v"
          }

          stop_services() {
              echo "Stopping FrankenPHP processes..."
              pkill -u "$USER" -f frankenphp 2>/dev/null || true
              sleep 3
          }

          remove_everything() {
              echo "Removing existing user installation..."
              rm -rf "$HOME/bin" "$HOME/lib" "$HOME/libexec"

              if [ "$EUID" -eq 0 ]; then
                  rm -f /usr/local/bin/{frankenphp,php,composer,node,npm,npx,git,sqlite3,zip,unzip}
                  rm -f /usr/local/bin/*.real
                  rm -rf /usr/local/lib/node_modules /usr/local/libexec/git-core
                  rm -f /usr/local/lib/libphp.so*
                  rm -f /etc/ld.so.conf.d/frankenphp.conf
                  ldconfig 2>/dev/null || true
              fi
          }

          install_fresh() {
              echo "Installing fresh to user directory..."

              mkdir -p "$HOME/bin.new" "$HOME/lib.new"
              cp -r "$SCRIPT_DIR/bin"/* "$HOME/bin.new/"
              cp -r "$SCRIPT_DIR/lib"/* "$HOME/lib.new/"
              [ -d "$SCRIPT_DIR/libexec" ] && cp -r "$SCRIPT_DIR/libexec" "$HOME/libexec.new"

              [ -d "$HOME/bin" ] && mv "$HOME/bin" "$HOME/bin.old" 2>/dev/null || true
              mv "$HOME/bin.new" "$HOME/bin"

              [ -d "$HOME/lib" ] && mv "$HOME/lib" "$HOME/lib.old" 2>/dev/null || true
              mv "$HOME/lib.new" "$HOME/lib"

              if [ -d "$HOME/libexec.new" ]; then
                  [ -d "$HOME/libexec" ] && mv "$HOME/libexec" "$HOME/libexec.old" 2>/dev/null || true
                  mv "$HOME/libexec.new" "$HOME/libexec"
              fi

              rm -rf "$HOME/bin.old" "$HOME/lib.old" "$HOME/libexec.old"
              chmod +x "$HOME/bin"/*
          }

          update_profile() {
              local profile="$HOME/.bash_profile"
              local marker="# FrankenPHP environment setup"

              if [ -f "$profile" ] && grep -q "$marker" "$profile"; then
                  sed -i.bak "/^$marker/,/^# End of FrankenPHP environment setup/d" "$profile"
              fi

              [ ! -f "$profile" ] && cat > "$profile" << 'EOFPROFILE'
          if [ -f ~/.profile ]; then . ~/.profile; fi
          if [ -f ~/.bashrc ]; then . ~/.bashrc; fi
          EOFPROFILE

              cat >> "$profile" << EOFPROFILE
          $marker
          export PATH="$HOME/bin:\$PATH"
          # End of FrankenPHP environment setup
          EOFPROFILE
          }

          main() {
              echo "franken-php install"
              echo "==================="

              if [ ! -f "$SCRIPT_DIR/bin/frankenphp.real" ]; then
                  echo "Error: Cannot find frankenphp.real in $SCRIPT_DIR/bin/"
                  exit 1
              fi

              show_versions

              if [ "$VERSIONED_INSTALL" = true ]; then
                  install_versioned
                  exit 0
              fi

              echo "This will install FrankenPHP to:"
              echo "  $HOME/bin"
              echo "  $HOME/lib"
              echo "  $HOME/libexec"
              echo ""

              printf "Continue? [y/N] "
              read -r REPLY
              [[ ! "$REPLY" =~ ^[Yy]$ ]] && echo "Cancelled" && exit 1

              stop_services
              remove_everything
              install_fresh
              update_profile

              echo ""
              echo "INSTALL COMPLETED"
              echo "Run: source ~/.bash_profile"
              echo "Then test: php -v && node -v && frankenphp version"
          }

          main "$@"
          EOF
          chmod +x dist/install.sh

      - name: Create update.sh
        run: |
          cp dist/install.sh dist/update.sh
          sed -i 's/franken-php install/franken-php update/g' dist/update.sh
          sed -i 's/INSTALL COMPLETED/UPDATE COMPLETED/g' dist/update.sh
          sed -i 's/Usage: \.\/install.sh --versioned/Usage: .\/update.sh --versioned/g' dist/update.sh
          chmod +x dist/update.sh

      - name: Create README
        run: |
          cat > dist/README.md << EOF
          # FrankenPHP Distribution

          ## Normal installation

          \`\`\`bash
          ./install.sh
          source ~/.bash_profile
          \`\`\`

          ## Normal update

          \`\`\`bash
          ./update.sh
          source ~/.bash_profile
          \`\`\`

          ## Build server versioned installation

          This keeps multiple PHP versions side by side:

          \`\`\`bash
          ./install.sh --versioned 8.4
          ./install.sh --versioned 8.5
          \`\`\`

          Installed to:

          \`\`\`
          ~/frankenphp/php8.4
          ~/frankenphp/php8.5
          \`\`\`

          Use in builds:

          \`\`\`bash
          export PATH="\$HOME/frankenphp/php8.4/bin:\$PATH"
          php -v

          export PATH="\$HOME/frankenphp/php8.5/bin:\$PATH"
          php -v
          \`\`\`
          EOF

      - name: Create archive
        run: |
          cd dist
          tar -czf ../frankenphp-linux-amd64-${PHP_SHORT}.tar.gz .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frankenphp-${{ env.PHP_SHORT }}
          path: frankenphp-linux-amd64-${{ env.PHP_SHORT }}.tar.gz
          retention-days: 7

  create-release:
    needs: [check-new-release, build-php]
    if: ${{ always() && needs.build-php.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      FRANKENPHP_VERSION: ${{ needs.check-new-release.outputs.latest_version }}

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find release-artifacts -name "*.tar.gz" -exec mv {} release-files/ \;
          ls -la release-files/

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: release-files/*
          tag_name: v${{ env.FRANKENPHP_VERSION }}
          name: FrankenPHP v${{ env.FRANKENPHP_VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            FrankenPHP v${{ env.FRANKENPHP_VERSION }} with PHP 8.4 and PHP 8.5.

            ## Downloads

            - `frankenphp-linux-amd64-php84.tar.gz`
            - `frankenphp-linux-amd64-php85.tar.gz`

            ## Normal install

            ```bash
            tar -xzf frankenphp-linux-amd64-php84.tar.gz
            ./install.sh
            source ~/.bash_profile
            ```

            ## Build server versioned install

            ```bash
            tar -xzf frankenphp-linux-amd64-php84.tar.gz
            ./install.sh --versioned 8.4

            tar -xzf frankenphp-linux-amd64-php85.tar.gz
            ./install.sh --versioned 8.5
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_RELEASE_TOKEN }}
