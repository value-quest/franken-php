name: Build FrankenPHP with PHP 8.4 and 8.5

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  check-new-release:
    runs-on: ubuntu-24.04
    outputs:
      latest_version: ${{ steps.get-latest.outputs.latest_version }}
      has_new_version: ${{ steps.check-new.outputs.has_new_version }}
      php84_latest: ${{ steps.get-php-versions.outputs.php84_latest }}
      php85_latest: ${{ steps.get-php-versions.outputs.php85_latest }}

    steps:
      - name: Get current FrankenPHP version
        id: get-current
        run: |
          echo "current_version=1.4.0" >> $GITHUB_OUTPUT

      - name: Get latest FrankenPHP release
        id: get-latest
        run: |
          LATEST_VERSION=$(curl -s https://api.github.com/repos/php/frankenphp/releases/latest | jq -r '.tag_name' | sed 's/v//')
          echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT

      - name: Check if new version exists
        id: check-new
        run: |
          CURRENT_VERSION="${{ steps.get-current.outputs.current_version }}"
          LATEST_VERSION="${{ steps.get-latest.outputs.latest_version }}"

          if [ "$CURRENT_VERSION" != "$LATEST_VERSION" ]; then
            echo "has_new_version=true" >> $GITHUB_OUTPUT
          else
            echo "has_new_version=false" >> $GITHUB_OUTPUT
          fi

      - name: Get latest PHP 8.4 and 8.5 versions
        id: get-php-versions
        run: |
          PHP84_LATEST=$(curl -s "https://api.github.com/repos/php/php-src/tags?per_page=100" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" | \
            jq -r '[.[] | select(.name | test("^php-8\\.4\\.[0-9]+$"))] | first | .name | ltrimstr("php-")')

          PHP85_LATEST=$(curl -s "https://api.github.com/repos/php/php-src/tags?per_page=100" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" | \
            jq -r '[.[] | select(.name | test("^php-8\\.5\\.[0-9]+$"))] | first | .name | ltrimstr("php-")')

          echo "php84_latest=$PHP84_LATEST" >> $GITHUB_OUTPUT
          echo "php85_latest=$PHP85_LATEST" >> $GITHUB_OUTPUT

  build-php:
    needs: check-new-release
    runs-on: ${{ matrix.target.runner }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: 'linux', arch: 'amd64', runner: 'ubuntu-24.04', node: 'x64' }
          - { os: 'linux', arch: 'arm64', runner: 'ubuntu-24.04-arm', node: 'arm64' }
          - { os: 'darwin', arch: 'amd64', runner: 'macos-15-intel', node: 'x64' }
          - { os: 'darwin', arch: 'arm64', runner: 'macos-15', node: 'arm64' }
        php:
          - { version: '${{ needs.check-new-release.outputs.php84_latest }}', short: 'php84', minor: '8.4' }
          - { version: '${{ needs.check-new-release.outputs.php85_latest }}', short: 'php85', minor: '8.5' }

    env:
      FRANKENPHP_VERSION: ${{ needs.check-new-release.outputs.latest_version }}
      PHP_VERSION: ${{ matrix.php.version }}
      PHP_SHORT: ${{ matrix.php.short }}
      PHP_MINOR: ${{ matrix.php.minor }}
      OS: ${{ matrix.target.os }}
      ARCH: ${{ matrix.target.arch }}

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl ca-certificates jq \
            pkg-config libssl-dev zlib1g-dev libbrotli-dev \
            autoconf automake libtool re2c libsqlite3-dev libcurl4-openssl-dev libonig-dev \
            libmariadb-dev libmariadb-dev-compat \
            libzip-dev libpng-dev libjpeg-dev libfreetype6-dev \
            libicu-dev libxslt1-dev sqlite3 zip unzip git python3-dev

      # PHP goes to its own prefix: the runner image has a Homebrew PHP, and
      # /usr/local is Homebrew's prefix on Intel. Keg-only formulas need their
      # pkg-config paths; the GitHub tarball has no generated parsers, which
      # needs a newer bison than macOS ships.
      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          brew install autoconf automake libtool bison re2c pkgconf \
            openssl@3 icu4c libiconv libxml2 curl sqlite zlib oniguruma \
            libzip libpng jpeg-turbo freetype brotli dylibbundler

          PKG_PATHS=""
          for formula in openssl@3 icu4c libiconv libxml2 curl sqlite zlib jpeg-turbo; do
            PKG_PATHS+="$(brew --prefix "$formula")/lib/pkgconfig:"
          done

          echo "PKG_CONFIG_PATH=${PKG_PATHS%:}" >> $GITHUB_ENV
          echo "PHP_PREFIX=$RUNNER_TEMP/php" >> $GITHUB_ENV
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
          echo "$RUNNER_TEMP/php/bin" >> $GITHUB_PATH

      - name: Download Node.js 24
        run: |
          NODE_MAJOR=24
          NODE_VERSION=$(curl -fsSL https://nodejs.org/dist/index.json | \
            jq -r --arg major "v${NODE_MAJOR}." '[.[] | select(.version | startswith($major))][0].version')
          echo "Resolved Node.js version: $NODE_VERSION"

          ARCHIVE="node-${NODE_VERSION}-${OS}-${{ matrix.target.node }}.tar.xz"
          curl -fsSL "https://nodejs.org/dist/${NODE_VERSION}/${ARCHIVE}" -o "$ARCHIVE"
          curl -fsSL "https://nodejs.org/dist/${NODE_VERSION}/SHASUMS256.txt" -o SHASUMS256.txt
          grep " ${ARCHIVE}\$" SHASUMS256.txt | shasum -a 256 -c -

          mkdir -p "$RUNNER_TEMP/node"
          tar xJf "$ARCHIVE" -C "$RUNNER_TEMP/node" --strip-components=1

          echo "NODE_PREFIX=$RUNNER_TEMP/node" >> $GITHUB_ENV
          "$RUNNER_TEMP/node/bin/node" --version
          "$RUNNER_TEMP/node/bin/node" "$RUNNER_TEMP/node/lib/node_modules/npm/bin/npm-cli.js" --version

      - name: Download PHP source
        run: |
          mkdir -p php-${PHP_VERSION}
          curl -L "https://github.com/php/php-src/archive/refs/tags/php-${PHP_VERSION}.tar.gz" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" | \
            tar xz --strip-components=1 -C php-${PHP_VERSION}

      - name: Build PHP
        run: |
          cd php-${PHP_VERSION}
          ./buildconf --force

          if [ "$RUNNER_OS" = macOS ]; then
            # Max execution timers need timer_create, which macOS lacks. The
            # header padding leaves room for dylibbundler's install names.
            PLATFORM_FLAGS=(
              --prefix="$PHP_PREFIX"
              --with-iconv="$(brew --prefix libiconv)"
              LDFLAGS=-Wl,-headerpad_max_install_names
            )
          else
            PLATFORM_FLAGS=(--enable-zend-max-execution-timers)
          fi

          ./configure \
            "${PLATFORM_FLAGS[@]}" \
            --enable-embed \
            --enable-zts \
            --disable-zend-signals \
            --enable-cli \
            --enable-mbstring \
            --with-openssl \
            --enable-xml \
            --enable-ctype \
            --with-curl \
            --enable-dom \
            --enable-fileinfo \
            --enable-filter \
            --enable-pdo \
            --with-pdo-sqlite \
            --with-pdo-mysql \
            --with-mysqli \
            --enable-session \
            --enable-tokenizer \
            --enable-bcmath \
            --with-zip \
            --enable-gd \
            --with-freetype \
            --with-jpeg \
            --enable-intl \
            --with-sqlite3 \
            --with-zlib \
            --enable-pcntl \
            --enable-soap \
            --enable-exif \
            --enable-opcache \
            --enable-sockets

          if [ "$RUNNER_OS" = macOS ]; then
            make -j"$(sysctl -n hw.ncpu)"
            make install
            ls -l "$PHP_PREFIX/lib"
          else
            make -j"$(nproc)"
            sudo make install
            sudo ldconfig
          fi
          command -v php
          php -v

      - name: Download FrankenPHP
        run: |
          curl -L https://github.com/php/frankenphp/archive/refs/tags/v${FRANKENPHP_VERSION}.tar.gz | tar xz

      # setup-go sets GOTOOLCHAIN=local, so install the version FrankenPHP requires
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: frankenphp-${{ env.FRANKENPHP_VERSION }}/caddy/go.mod
          cache: false

      - name: Build FrankenPHP
        working-directory: frankenphp-${{ env.FRANKENPHP_VERSION }}/caddy/frankenphp
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            # libphp is not in a default search path here, unlike /usr/local/lib
            # on Linux. Brotli comes from Homebrew; dylibbundler rewrites the
            # library paths when packaging.
            BREW_PREFIX="$(brew --prefix)"
            PHP_LIB="$(php-config --prefix)/lib"
            CGO_CFLAGS="$(php-config --includes) -I$BREW_PREFIX/include" \
            CGO_LDFLAGS="-L$PHP_LIB $(php-config --ldflags) $(php-config --libs) -L$BREW_PREFIX/lib -Wl,-rpath,$PHP_LIB -Wl,-headerpad_max_install_names" \
            go build -tags=nobadger,nomysql,nopgx,nowatcher
          else
            CGO_CFLAGS="$(php-config --includes)" \
            CGO_LDFLAGS="$(php-config --ldflags) $(php-config --libs) -Wl,-rpath,\$ORIGIN/../lib" \
            go build -tags=nobadger,nomysql,nopgx,nowatcher
          fi
          ./frankenphp version

      - name: Download Composer
        run: |
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          EXPECTED_CHECKSUM="$(php -r 'copy("https://composer.github.io/installer.sig", "php://stdout");')"
          ACTUAL_CHECKSUM="$(php -r "echo hash_file('sha384', 'composer-setup.php');")"

          if [ "$EXPECTED_CHECKSUM" != "$ACTUAL_CHECKSUM" ]; then
            echo "Invalid composer installer checksum"
            exit 1
          fi

          php composer-setup.php --quiet
          rm composer-setup.php

      - name: Package files
        run: |
          mkdir -p dist/bin dist/lib dist/libexec

          cp frankenphp-${FRANKENPHP_VERSION}/caddy/frankenphp/frankenphp dist/bin/frankenphp
          cp "$(php-config --prefix)/bin/php" dist/bin/php
          cp "$(php-config --prefix)/bin/php-config" dist/bin/php-config
          cp "$(php-config --prefix)/bin/phpize" dist/bin/phpize
          cp composer.phar dist/bin/composer
          chmod +x dist/bin/*

          # macOS ships git, sqlite3, zip and unzip
          if [ "$RUNNER_OS" = Linux ]; then
            cp "$(php-config --prefix)/lib/libphp.so" dist/lib/

            for tool in sqlite3 zip unzip; do
              command -v "$tool" >/dev/null && cp "$(which "$tool")" dist/bin/
            done
          fi

          if [ "$RUNNER_OS" = Linux ] && command -v git >/dev/null; then
            cp "$(which git)" dist/bin/git.real
            GIT_EXEC_PATH=$(git --exec-path)
            mkdir -p dist/libexec/git-core
            cp -r "$GIT_EXEC_PATH"/* dist/libexec/git-core/

            cat > dist/bin/git << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          export GIT_EXEC_PATH="$SCRIPT_DIR/../libexec/git-core"
          exec "$SCRIPT_DIR/git.real" "$@"
          EOF
            chmod +x dist/bin/git
          fi

          if [ -x "$NODE_PREFIX/bin/node" ]; then
            cp "$NODE_PREFIX/bin/node" dist/bin/
            mkdir -p dist/lib/node_modules
            cp -r "$NODE_PREFIX/lib/node_modules/npm" dist/lib/node_modules/

            cat > dist/bin/npm << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          export NODE_PATH="$SCRIPT_DIR/../lib/node_modules"
          exec "$SCRIPT_DIR/node" "$SCRIPT_DIR/../lib/node_modules/npm/bin/npm-cli.js" "$@"
          EOF

            cat > dist/bin/npx << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          export NODE_PATH="$SCRIPT_DIR/../lib/node_modules"
          exec "$SCRIPT_DIR/node" "$SCRIPT_DIR/../lib/node_modules/npm/bin/npx-cli.js" "$@"
          EOF

            chmod +x dist/bin/npm dist/bin/npx
          fi

      - name: Bundle shared libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          for binary in dist/bin/frankenphp dist/bin/php dist/lib/libphp.so; do
            ldd "$binary" | grep "=> /" | awk '{print $3}' | grep -v "libc.so" | grep -v "ld-linux" | xargs -I '{}' cp -v '{}' dist/lib/ || true
          done

      # Copies libphp and the Homebrew libraries into lib and points the
      # binaries at them through @executable_path, so no DYLD_LIBRARY_PATH is
      # needed (SIP strips it anyway). Rewriting invalidates the signatures,
      # hence the ad-hoc re-signing.
      - name: Bundle shared libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          dylibbundler -of -b -cd \
            -d dist/lib -p @executable_path/../lib \
            -s "$(php-config --prefix)/lib" \
            -x dist/bin/frankenphp -x dist/bin/php

          codesign --force --sign - dist/bin/frankenphp dist/bin/php dist/lib/*.dylib

          otool -L dist/bin/frankenphp dist/bin/php dist/lib/*.dylib
          if otool -L dist/bin/frankenphp dist/bin/php dist/lib/*.dylib |
              grep -E "$(brew --prefix)/|/usr/local/|$RUNNER_TEMP/"; then
            echo "Binaries still reference libraries of the build machine"
            exit 1
          fi

      - name: Create wrappers
        run: |
          mv dist/bin/php dist/bin/php.real
          cat > dist/bin/php << 'EOF'
          #!/bin/bash
          SOURCE="${BASH_SOURCE[0]}"
          while [ -h "$SOURCE" ]; do
            DIR="$(cd -P "$(dirname "$SOURCE")" && pwd)"
            SOURCE="$(readlink "$SOURCE")"
            [[ $SOURCE != /* ]] && SOURCE="$DIR/$SOURCE"
          done
          SCRIPT_DIR="$(cd -P "$(dirname "$SOURCE")" && pwd)"
          export LD_LIBRARY_PATH="$SCRIPT_DIR/../lib:$LD_LIBRARY_PATH"
          exec "$SCRIPT_DIR/php.real" "$@"
          EOF
          chmod +x dist/bin/php

          mv dist/bin/frankenphp dist/bin/frankenphp.real
          cat > dist/bin/frankenphp << 'EOF'
          #!/bin/bash
          SOURCE="${BASH_SOURCE[0]}"
          while [ -h "$SOURCE" ]; do
            DIR="$(cd -P "$(dirname "$SOURCE")" && pwd)"
            SOURCE="$(readlink "$SOURCE")"
            [[ $SOURCE != /* ]] && SOURCE="$DIR/$SOURCE"
          done
          SCRIPT_DIR="$(cd -P "$(dirname "$SOURCE")" && pwd)"
          export LD_LIBRARY_PATH="$SCRIPT_DIR/../lib:$LD_LIBRARY_PATH"
          exec "$SCRIPT_DIR/frankenphp.real" "$@"
          EOF
          chmod +x dist/bin/frankenphp

      - name: Add install.sh and update.sh
        run: |
          cp scripts/install.sh dist/install.sh
          cp scripts/install.sh dist/update.sh
          chmod +x dist/install.sh dist/update.sh

      - name: Smoke test install and update
        run: |
          # Exercises the scripts' own checks: the packaged binaries run and the
          # installed ones report the packaged PHP version.
          SMOKE_HOME="$RUNNER_TEMP/smoke-home"
          mkdir -p "$SMOKE_HOME"
          HOME="$SMOKE_HOME" ./dist/install.sh
          HOME="$SMOKE_HOME" ./dist/update.sh
          HOME="$SMOKE_HOME" ./dist/update.sh --versioned "$PHP_MINOR"
          test "$("$SMOKE_HOME/bin/php" -r 'echo PHP_VERSION;')" = "$PHP_VERSION"

      - name: Create README
        run: |
          cat > dist/README.md << EOF
          # FrankenPHP Distribution

          ## Normal installation

          \`\`\`bash
          ./install.sh
          source ~/.bash_profile
          \`\`\`

          ## Normal update

          \`\`\`bash
          ./update.sh
          source ~/.bash_profile
          \`\`\`

          ## Build server versioned installation

          This keeps multiple PHP versions side by side:

          \`\`\`bash
          ./install.sh --versioned 8.4
          ./install.sh --versioned 8.5
          \`\`\`

          Installed to:

          \`\`\`
          ~/frankenphp/php8.4
          ~/frankenphp/php8.5
          \`\`\`

          Use in builds:

          \`\`\`bash
          export PATH="\$HOME/frankenphp/php8.4/bin:\$PATH"
          php -v

          export PATH="\$HOME/frankenphp/php8.5/bin:\$PATH"
          php -v
          \`\`\`
          EOF

      - name: Create archive
        run: |
          cd dist
          tar -czf ../frankenphp-${OS}-${ARCH}-${PHP_SHORT}.tar.gz .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: frankenphp-${{ env.OS }}-${{ env.ARCH }}-${{ env.PHP_SHORT }}
          path: frankenphp-${{ env.OS }}-${{ env.ARCH }}-${{ env.PHP_SHORT }}.tar.gz
          retention-days: 7

  create-release:
    needs: [check-new-release, build-php]
    if: ${{ always() && needs.build-php.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    env:
      FRANKENPHP_VERSION: ${{ needs.check-new-release.outputs.latest_version }}

    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts/

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find release-artifacts -name "*.tar.gz" -exec mv {} release-files/ \;
          ls -la release-files/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: release-files/*
          tag_name: v${{ env.FRANKENPHP_VERSION }}
          name: FrankenPHP v${{ env.FRANKENPHP_VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            FrankenPHP v${{ env.FRANKENPHP_VERSION }} with PHP 8.4 and PHP 8.5.

            ## Downloads

            - `frankenphp-linux-amd64-php84.tar.gz`
            - `frankenphp-linux-amd64-php85.tar.gz`
            - `frankenphp-linux-arm64-php84.tar.gz`
            - `frankenphp-linux-arm64-php85.tar.gz`
            - `frankenphp-darwin-amd64-php84.tar.gz`
            - `frankenphp-darwin-amd64-php85.tar.gz`
            - `frankenphp-darwin-arm64-php84.tar.gz`
            - `frankenphp-darwin-arm64-php85.tar.gz`

            Pick `linux` or `darwin` (macOS), and `amd64` or `arm64` to match `uname -m` (`x86_64` / `aarch64` or `arm64`).

            On macOS, download with `curl` or `gh`, or after a browser download run `xattr -dr com.apple.quarantine .` in the extracted directory: the binaries are only ad-hoc signed.

            ## Normal install

            ```bash
            tar -xzf frankenphp-linux-amd64-php84.tar.gz
            ./install.sh
            source ~/.bash_profile
            ```

            ## Build server versioned install

            ```bash
            tar -xzf frankenphp-linux-amd64-php84.tar.gz
            ./install.sh --versioned 8.4

            tar -xzf frankenphp-linux-amd64-php85.tar.gz
            ./install.sh --versioned 8.5
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_RELEASE_TOKEN }}
